name: Update Portfolio

on:
  workflow_dispatch:

  schedule:
    # Every day at 09:00 IST (03:30 UTC)
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Discover repositories tagged with "portfolio"
      # ------------------------------------------------------------
      - name: Discover portfolio repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/orgs/SD-AI-Labs/repos?per_page=100&type=all" \
            | jq -s 'add' > /tmp/all-repos.json

          jq '
            [
              .[]
              | select(.name != "portfolio")
              | select(.archived == false)
              | select((.topics // []) | index("portfolio"))
            ]
            | sort_by(.name | ascii_downcase)
          ' /tmp/all-repos.json > /tmp/portfolio-repos.json

          echo "Portfolio repositories:"
          jq -r '.[].name' /tmp/portfolio-repos.json

      # ------------------------------------------------------------
      # Read README descriptions and discover useful documentation
      # ------------------------------------------------------------
      - name: Collect project information
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import base64
          import json
          import re
          import subprocess
          from pathlib import Path

          repos = json.loads(
              Path("/tmp/portfolio-repos.json").read_text()
          )


          def gh_api(endpoint):
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      endpoint,
                      "-H",
                      "X-GitHub-Api-Version: 2022-11-28",
                  ],
                  capture_output=True,
                  text=True,
              )

              if result.returncode != 0:
                  print(f"GitHub API failed: {endpoint}")
                  print(result.stderr)
                  return None

              try:
                  return json.loads(result.stdout)
              except json.JSONDecodeError:
                  return None


          def clean_markdown(text):
              if not text:
                  return ""

              # Remove HTML comments
              text = re.sub(
                  r"<!--.*?-->",
                  "",
                  text,
                  flags=re.DOTALL
              )

              # Remove markdown images
              text = re.sub(
                  r"!\[[^\]]*\]\([^)]*\)",
                  "",
                  text
              )

              # Convert markdown links to their text
              text = re.sub(
                  r"\[([^\]]+)\]\([^)]*\)",
                  r"\1",
                  text
              )

              # Remove markdown headings
              text = re.sub(
                  r"^\s*#+\s*",
                  "",
                  text
              )

              # Remove inline code formatting
              text = text.replace("`", "")

              # Remove emphasis
              text = text.replace("**", "")
              text = text.replace("__", "")

              # Collapse whitespace
              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def extract_description(readme):
              """
              Extract the first meaningful paragraph from README.md.
              """

              if not readme:
                  return ""

              lines = readme.splitlines()

              paragraphs = []
              current = []

              inside_code = False

              for line in lines:

                  stripped = line.strip()

                  # Code blocks
                  if stripped.startswith("```"):
                      inside_code = not inside_code
                      continue

                  if inside_code:
                      continue

                  # Paragraph boundary
                  if not stripped:

                      if current:
                          paragraphs.append(
                              " ".join(current)
                          )
                          current = []

                      continue

                  # Ignore headings
                  if stripped.startswith("#"):
                      continue

                  # Ignore markdown images
                  if stripped.startswith("!["):
                      continue

                  # Ignore HTML
                  if stripped.startswith("<"):
                      continue

                  # Ignore badges
                  if (
                      stripped.startswith("[![")
                      or "shields.io" in stripped.lower()
                  ):
                      continue

                  current.append(stripped)

              if current:
                  paragraphs.append(
                      " ".join(current)
                  )

              # Find first useful paragraph
              for paragraph in paragraphs:

                  paragraph = clean_markdown(
                      paragraph
                  )

                  if len(paragraph) < 30:
                      continue

                  lower = paragraph.lower()

                  # Ignore common README sections
                  ignored_starts = (
                      "table of contents",
                      "installation",
                      "usage",
                      "features",
                      "getting started",
                      "quick start",
                      "requirements",
                  )

                  if lower.startswith(
                      ignored_starts
                  ):
                      continue

                  # Keep descriptions concise
                  if len(paragraph) > 280:
                      paragraph = (
                          paragraph[:277].rstrip()
                          + "..."
                      )

                  return paragraph

              return ""


          def documentation_priority(path):
              """
              Lower number = higher priority.
              """

              lower = path.lower()

              # README is always highest priority
              if lower == "readme.md":
                  return 0

              # Important root-level docs
              root_priority = {
                  "architecture.md": 1,
                  "design.md": 1,
                  "overview.md": 1,
                  "project_context.md": 1,
                  "documentation.md": 1,
                  "api.md": 1,
                  "evaluation.md": 1,
                  "deployment.md": 1,
                  "usage.md": 1,
              }

              filename = lower.split("/")[-1]

              if "/" not in lower:
                  return root_priority.get(
                      filename,
                      2
                  )

              # docs/ files
              if (
                  lower.startswith("docs/")
                  and lower.count("/") == 1
              ):
                  return 3

              return 4


          for repo in repos:

              name = repo["name"]
              branch = repo["default_branch"]

              print()
              print(
                  f"===== {name} ====="
              )

              # --------------------------------------------------
              # README
              # --------------------------------------------------

              readme = gh_api(
                  f"/repos/SD-AI-Labs/{name}/readme"
              )

              description = ""

              if (
                  readme
                  and readme.get("content")
              ):

                  try:
                      content = base64.b64decode(
                          readme["content"]
                      ).decode(
                          "utf-8",
                          errors="ignore"
                      )

                      description = (
                          extract_description(
                              content
                          )
                      )

                  except Exception as exc:
                      print(
                          f"README parsing failed: {exc}"
                      )

              # Fallback to GitHub description
              if not description:
                  description = (
                      repo.get("description")
                      or "AI engineering project."
                  )

              repo[
                  "portfolio_description"
              ] = description

              # --------------------------------------------------
              # Repository tree
              # --------------------------------------------------

              tree = gh_api(
                  f"/repos/SD-AI-Labs/{name}/git/trees/"
                  f"{branch}?recursive=1"
              )

              documentation = []

              if tree:

                  for item in tree.get(
                      "tree",
                      []
                  ):

                      if item.get("type") != "blob":
                          continue

                      path = item.get(
                          "path",
                          ""
                      )

                      lower = path.lower()

                      # Markdown only
                      if not lower.endswith(".md"):
                          continue

                      # ------------------------------------------------
                      # README
                      # ------------------------------------------------

                      if lower == "readme.md":
                          documentation.append(
                              path
                          )
                          continue

                      # ------------------------------------------------
                      # Root-level documentation
                      # ------------------------------------------------

                      if "/" not in path:
                          documentation.append(
                              path
                          )
                          continue

                      # ------------------------------------------------
                      # Direct docs/ files only
                      #
                      # docs/foo.md       -> include
                      # docs/foo/bar.md   -> ignore
                      # ------------------------------------------------

                      if (
                          lower.startswith("docs/")
                          and lower.count("/") == 1
                      ):
                          documentation.append(
                              path
                          )

              # Sort by documentation importance
              documentation.sort(
                  key=lambda p: (
                      documentation_priority(p),
                      p.lower()
                  )
              )

              # Maximum 4 documentation files
              repo["documentation"] = (
                  documentation[:4]
              )

              print(
                  "Description:",
                  description
              )

              print(
                  "Documentation:"
              )

              for path in repo[
                  "documentation"
              ]:
                  print(
                      f"  - {path}"
                  )


          Path(
              "/tmp/portfolio-repos-final.json"
          ).write_text(
              json.dumps(
                  repos,
                  indent=2
              )
          )

          PY

      # ------------------------------------------------------------
      # Generate README
      # ------------------------------------------------------------
      - name: Generate portfolio section
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          readme = Path("README.md")

          repos = json.loads(
              Path(
                  "/tmp/portfolio-repos-final.json"
              ).read_text()
          )

          lines = []

          if not repos:

              lines.extend([
                  "_No repositories are tagged `portfolio` yet._",
                  "",
                  "Add the `portfolio` topic to a repository "
                  "in `SD-AI-Labs` and it will appear here automatically."
              ])

          else:

              for repo in repos:

                  name = repo["name"]
                  url = repo["html_url"]
                  branch = repo[
                      "default_branch"
                  ]

                  description = (
                      repo.get(
                          "portfolio_description"
                      )
                      or "AI engineering project."
                  )

                  topics = [
                      topic
                      for topic in (
                          repo.get("topics") or []
                      )
                      if topic != "portfolio"
                  ]

                  # ------------------------------------------------
                  # Project title
                  # ------------------------------------------------

                  lines.append(
                      f"### [{name}]({url})"
                  )

                  lines.append("")

                  # ------------------------------------------------
                  # Description
                  # ------------------------------------------------

                  lines.append(
                      description
                  )

                  lines.append("")

                  # ------------------------------------------------
                  # Topics
                  # ------------------------------------------------

                  if topics:

                      topic_text = " ".join(
                          f"`{topic}`"
                          for topic in topics[:8]
                      )

                      lines.append(
                          topic_text
                      )

                      lines.append("")

                  # ------------------------------------------------
                  # Additional documentation
                  #
                  # README is not shown here because the description
                  # already comes from README.md.
                  # ------------------------------------------------

                  additional_docs = [
                      path
                      for path in repo.get(
                          "documentation",
                          []
                      )
                      if path.lower()
                      != "readme.md"
                  ]

                  if additional_docs:

                      links = []

                      for path in additional_docs:

                          file_url = (
                              "https://github.com/"
                              "SD-AI-Labs/"
                              f"{name}/blob/"
                              f"{branch}/"
                              f"{path}"
                          )

                          lower = path.lower()

                          if lower.startswith(
                              "docs/"
                          ):
                              label = path[
                                  5:
                              ]

                          else:
                              label = path

                          label = (
                              label
                              .replace(
                                  ".md",
                                  ""
                              )
                              .replace(
                                  "-",
                                  " "
                              )
                              .replace(
                                  "_",
                                  " "
                              )
                              .replace(
                                  "/",
                                  " / "
                              )
                              .title()
                          )

                          links.append(
                              f"[{label}]({file_url})"
                          )

                      lines.append(
                          "**Documentation:** "
                          + " · ".join(links)
                      )

                      lines.append("")

                  # ------------------------------------------------
                  # Repository
                  # ------------------------------------------------

                  lines.append(
                      f"[Repository →]({url})"
                  )

                  lines.append("")

                  lines.append("---")

                  lines.append("")


          generated = "\n".join(
              lines
          ).rstrip()

          content = readme.read_text()

          pattern = (
              r"<!-- PORTFOLIO:START -->"
              r".*?"
              r"<!-- PORTFOLIO:END -->"
          )

          replacement = (
              "<!-- PORTFOLIO:START -->\n\n"
              + generated
              + "\n\n"
              + "<!-- PORTFOLIO:END -->"
          )

          updated = re.sub(
              pattern,
              replacement,
              content,
              flags=re.DOTALL
          )

          if updated == content:
              raise SystemExit(
                  "Could not find PORTFOLIO markers in README.md"
              )

          readme.write_text(
              updated
          )

          PY

      # ------------------------------------------------------------
      # Commit only if README changed
      # ------------------------------------------------------------
      - name: Commit portfolio changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No portfolio changes."
            exit 0
          fi

          git commit \
            -m "chore: update portfolio projects"

          git push
