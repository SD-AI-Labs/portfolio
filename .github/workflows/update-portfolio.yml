name: Update Portfolio

on:
  workflow_dispatch:

  schedule:
    # Every day at 09:00 IST (03:30 UTC)
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v4

      - name: Discover portfolio repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/orgs/SD-AI-Labs/repos?per_page=100&type=all" \
            | jq -s 'add' > /tmp/all-repos.json

          jq '
            [
              .[]
              | select(.name != "portfolio")
              | select(.archived == false)
              | select((.topics // []) | index("portfolio"))
            ]
            | sort_by(.name | ascii_downcase)
          ' /tmp/all-repos.json > /tmp/portfolio-repos.json

          echo "Portfolio repositories:"
          jq -r '.[].name' /tmp/portfolio-repos.json

      - name: Collect project information
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          repos = json.loads(
              Path("/tmp/portfolio-repos.json").read_text()
          )

          def gh_api(endpoint):
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      endpoint,
                      "-H",
                      "X-GitHub-Api-Version: 2022-11-28",
                  ],
                  capture_output=True,
                  text=True,
              )

              if result.returncode != 0:
                  return None

              try:
                  return json.loads(result.stdout)
              except json.JSONDecodeError:
                  return None

          def clean_markdown(text):
              if not text:
                  return ""

              # Remove HTML comments
              text = re.sub(r"<!--.*?-->", "", text, flags=re.DOTALL)

              # Remove markdown images
              text = re.sub(r"!\[[^\]]*\]\([^)]*\)", "", text)

              # Convert markdown links to their text
              text = re.sub(r"\[([^\]]+)\]\([^)]*\)", r"\1", text)

              # Remove headings
              text = re.sub(r"^\s*#+\s*", "", text)

              # Remove code formatting
              text = text.replace("`", "")

              # Remove emphasis
              text = text.replace("**", "")
              text = text.replace("__", "")

              # Collapse whitespace
              text = re.sub(r"\s+", " ", text)

              return text.strip()

          def extract_description(readme):
              if not readme:
                  return ""

              lines = readme.splitlines()

              # Remove badges/images/comments and find the first
              # meaningful paragraph after the title.
              paragraphs = []
              current = []

              inside_code = False

              for line in lines:

                  if line.strip().startswith("```"):
                      inside_code = not inside_code
                      continue

                  if inside_code:
                      continue

                  stripped = line.strip()

                  if not stripped:
                      if current:
                          paragraphs.append(" ".join(current))
                          current = []
                      continue

                  # Ignore headings
                  if stripped.startswith("#"):
                      continue

                  # Ignore images/badges
                  if stripped.startswith("!["):
                      continue

                  # Ignore HTML
                  if stripped.startswith("<"):
                      continue

                  current.append(stripped)

              if current:
                  paragraphs.append(" ".join(current))

              # Find first meaningful paragraph.
              for paragraph in paragraphs:

                  paragraph = clean_markdown(paragraph)

                  if len(paragraph) < 30:
                      continue

                  # Ignore common README boilerplate
                  lower = paragraph.lower()

                  if lower.startswith("table of contents"):
                      continue

                  if lower.startswith("installation"):
                      continue

                  if lower.startswith("usage"):
                      continue

                  if lower.startswith("features"):
                      continue

                  # Limit description length
                  if len(paragraph) > 280:
                      paragraph = paragraph[:277].rstrip() + "..."

                  return paragraph

              return ""

          def documentation_priority(path):

              lower = path.lower()

              # Highest priority
              if lower == "readme.md":
                  return 0

              # Standard root documentation
              root_names = {
                  "architecture.md",
                  "design.md",
                  "api.md",
                  "evaluation.md",
                  "deployment.md",
                  "usage.md",
                  "documentation.md",
                  "overview.md",
              }

              if "/" not in lower and lower in root_names:
                  return 1

              # Documentation directory
              if lower.startswith("docs/"):
                  return 2

              # Everything else
              return 3

          for repo in repos:

              name = repo["name"]
              branch = repo["default_branch"]

              print(f"\n===== {name} =====")

              # --------------------------------------------------
              # Get README
              # --------------------------------------------------

              readme = gh_api(
                  f"/repos/SD-AI-Labs/{name}/readme"
              )

              description = ""

              if readme and readme.get("content"):

                  import base64

                  try:
                      content = base64.b64decode(
                          readme["content"]
                      ).decode("utf-8", errors="ignore")

                      description = extract_description(content)

                  except Exception:
                      pass

              # Fallback to GitHub repository description
              if not description:
                  description = (
                      repo.get("description")
                      or "AI engineering project."
                  )

              repo["portfolio_description"] = description

              # --------------------------------------------------
              # Find documentation files
              # --------------------------------------------------

              tree = gh_api(
                  f"/repos/SD-AI-Labs/{name}/git/trees/"
                  f"{branch}?recursive=1"
              )

              documentation = []

              if tree:

                  for item in tree.get("tree", []):

                      if item.get("type") != "blob":
                          continue

                      path = item.get("path", "")

                      if not path.lower().endswith(".md"):
                          continue

                      lower = path.lower()

                      # Ignore generated/data/source markdown
                      ignored_prefixes = (
                          "data/",
                          "uploads/",
                          "generated/",
                          "build/",
                          "dist/",
                          "node_modules/",
                          "vendor/",
                          "examples/",
                      )

                      if lower.startswith(ignored_prefixes):
                          continue

                      documentation.append(path)

              documentation.sort(
                  key=lambda p: (
                      documentation_priority(p),
                      p.lower()
                  )
              )

              # Maximum 4 documents
              repo["documentation"] = documentation[:4]

              print(
                  f"Description: {description}"
              )

              print("Documentation:")

              for path in repo["documentation"]:
                  print(f"  - {path}")

          Path(
              "/tmp/portfolio-repos-final.json"
          ).write_text(
              json.dumps(repos, indent=2)
          )

          PY

      - name: Generate portfolio section
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          readme = Path("README.md")

          repos = json.loads(
              Path("/tmp/portfolio-repos-final.json").read_text()
          )

          lines = []

          if not repos:

              lines.extend([
                  "_No repositories are tagged `portfolio` yet._",
                  "",
                  "Add the `portfolio` topic to a repository in "
                  "`SD-AI-Labs` and it will appear here automatically."
              ])

          else:

              for repo in repos:

                  name = repo["name"]
                  url = repo["html_url"]
                  branch = repo["default_branch"]

                  description = (
                      repo.get("portfolio_description")
                      or "AI engineering project."
                  )

                  topics = [
                      topic
                      for topic in (repo.get("topics") or [])
                      if topic != "portfolio"
                  ]

                  # Project title
                  lines.append(
                      f"### [{name}]({url})"
                  )
                  lines.append("")

                  # Description
                  lines.append(description)
                  lines.append("")

                  # Topics
                  if topics:

                      topic_text = " ".join(
                          f"`{topic}`"
                          for topic in topics[:8]
                      )

                      lines.append(topic_text)
                      lines.append("")

                  # Documentation
                  documentation = repo.get(
                      "documentation", []
                  )

                  if documentation:

                      links = []

                      for path in documentation:

                          file_url = (
                              f"https://github.com/"
                              f"SD-AI-Labs/{name}/blob/"
                              f"{branch}/{path}"
                          )

                          lower = path.lower()

                          if lower == "readme.md":
                              label = "README"

                          elif lower.startswith("docs/"):
                              label = path[5:].replace(
                                  ".md", ""
                              ).replace(
                                  "-", " "
                              ).replace(
                                  "_", " "
                              ).title()

                          else:
                              label = path.replace(
                                  ".md", ""
                              ).replace(
                                  "-", " "
                              ).replace(
                                  "_", " "
                              ).title()

                          links.append(
                              f"[{label}]({file_url})"
                          )

                      lines.append(
                          "**Documentation:** "
                          + " · ".join(links)
                      )
                      lines.append("")

                  lines.append(
                      f"[Repository →]({url})"
                  )

                  lines.append("")
                  lines.append("---")
                  lines.append("")

          generated = "\n".join(lines).rstrip()

          content = readme.read_text()

          pattern = (
              r"<!-- PORTFOLIO:START -->"
              r".*?"
              r"<!-- PORTFOLIO:END -->"
          )

          replacement = (
              "<!-- PORTFOLIO:START -->\n\n"
              + generated
              + "\n\n"
              + "<!-- PORTFOLIO:END -->"
          )

          updated = re.sub(
              pattern,
              replacement,
              content,
              flags=re.DOTALL,
          )

          if updated == content:
              raise SystemExit(
                  "Could not find PORTFOLIO markers in README.md"
              )

          readme.write_text(updated)

          PY

      - name: Commit portfolio changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No portfolio changes."
            exit 0
          fi

          git commit -m "chore: update portfolio projects"
          git push
