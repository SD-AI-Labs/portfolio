name: Update Portfolio

on:
  workflow_dispatch:

  schedule:
    # Every day at 09:00 IST (03:30 UTC)
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v4

      - name: Discover portfolio repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/orgs/SD-AI-Labs/repos?per_page=100&type=all" \
            | jq -s 'add' > /tmp/all-repos.json

          jq '
            [
              .[]
              | select(.name != "portfolio")
              | select(.archived == false)
              | select((.topics // []) | index("portfolio"))
            ]
            | sort_by(.name | ascii_downcase)
          ' /tmp/all-repos.json > /tmp/portfolio-repos.json

          echo "Portfolio repositories:"
          jq -r '.[].name' /tmp/portfolio-repos.json

      - name: Discover project documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess

          repos = json.load(open("/tmp/portfolio-repos.json"))

          for repo in repos:
              name = repo["name"]

              print(f"Discovering documentation for {name}...")

              try:
                  result = subprocess.run(
                      [
                          "gh",
                          "api",
                          f"/repos/SD-AI-Labs/{name}/git/trees/{repo['default_branch']}?recursive=1",
                          "-H",
                          "X-GitHub-Api-Version: 2022-11-28",
                      ],
                      capture_output=True,
                      text=True,
                      check=True,
                  )

                  tree = json.loads(result.stdout)

              except Exception as e:
                  print(f"Could not inspect {name}: {e}")
                  repo["documentation"] = []
                  continue

              files = []

              for item in tree.get("tree", []):
                  if item.get("type") != "blob":
                      continue

                  path = item.get("path", "")

                  if not path.lower().endswith(".md"):
                      continue

                  files.append(path)

              # Documentation priority:
              #
              # 1. README.md
              # 2. docs/*.md
              # 3. Other markdown files
              #
              # Maximum 4 files.

              def priority(path):
                  lower = path.lower()

                  if lower == "readme.md":
                      return 0

                  if lower.startswith("docs/"):
                      return 1

                  return 2

              files.sort(key=lambda p: (priority(p), p.lower()))

              repo["documentation"] = files[:4]

          with open("/tmp/portfolio-repos-with-docs.json", "w") as f:
              json.dump(repos, f, indent=2)

          PY

          echo ""
          echo "Documentation discovered:"
          jq -r '
            .[] |
            "===== \(.name) =====",
            (.documentation[]? | "  - \(.)")
          ' /tmp/portfolio-repos-with-docs.json

      - name: Generate portfolio section
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          readme = Path("README.md")

          repos = json.loads(
              Path("/tmp/portfolio-repos-with-docs.json").read_text()
          )

          lines = []

          if not repos:

              lines.extend([
                  "_No repositories are tagged `portfolio` yet._",
                  "",
                  "Add the `portfolio` topic to a repository in the "
                  "`SD-AI-Labs` organization, then run the "
                  "**Update Portfolio** workflow manually or wait for "
                  "the scheduled refresh."
              ])

          else:

              for repo in repos:

                  name = repo["name"]
                  url = repo["html_url"]
                  branch = repo["default_branch"]

                  description = (
                      repo.get("description")
                      or "AI engineering project."
                  )

                  topics = [
                      topic
                      for topic in (repo.get("topics") or [])
                      if topic != "portfolio"
                  ]

                  lines.append(f"### [{name}]({url})")
                  lines.append("")
                  lines.append(description)
                  lines.append("")

                  if topics:
                      topic_text = " · ".join(
                          f"`{topic}`"
                          for topic in topics[:8]
                      )

                      lines.append(f"**Topics:** {topic_text}")
                      lines.append("")

                  documentation = repo.get("documentation", [])

                  if documentation:

                      lines.append("**Project Documentation**")
                      lines.append("")

                      for path in documentation:

                          file_url = (
                              f"https://github.com/SD-AI-Labs/"
                              f"{name}/blob/{branch}/{path}"
                          )

                          # Friendly display names

                          if path.lower() == "readme.md":
                              display_name = "README.md"

                          else:
                              display_name = path

                          lines.append(
                              f"- [{display_name}]({file_url})"
                          )

                      lines.append("")

                  lines.append(
                      f"[View Repository →]({url})"
                  )

                  lines.append("")
                  lines.append("---")
                  lines.append("")

          generated = "\n".join(lines).rstrip()

          content = readme.read_text()

          pattern = (
              r"<!-- PORTFOLIO:START -->"
              r".*?"
              r"<!-- PORTFOLIO:END -->"
          )

          replacement = (
              "<!-- PORTFOLIO:START -->\n\n"
              + generated
              + "\n\n"
              + "<!-- PORTFOLIO:END -->"
          )

          updated = re.sub(
              pattern,
              replacement,
              content,
              flags=re.DOTALL,
          )

          if updated == content:
              raise SystemExit(
                  "Could not find PORTFOLIO markers in README.md"
              )

          readme.write_text(updated)

          PY

      - name: Show generated README
        run: |
          echo "===== Generated Portfolio ====="
          sed -n '/<!-- PORTFOLIO:START -->/,/<!-- PORTFOLIO:END -->/p' README.md

      - name: Commit portfolio changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No portfolio changes."
            exit 0
          fi

          git commit -m "chore: update portfolio projects"
          git push
